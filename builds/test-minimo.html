<!doctype html>
<html><head><meta charset="UTF-8"><title>Test mínimo</title>
<style>
body { background: #161b22; color: #e6e9ef; font: 16px sans-serif; padding: 2rem; }
.ok { color: #3fb950; font-size: 24px; }
.fail { color: #f85149; }
button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
#log { margin-top: 1rem; font-family: monospace; font-size: 12px; color: #8b95a8; white-space: pre-wrap; }
</style></head><body>
<h1>Test mínimo file://</h1>
<p>Si ves esto, HTML+CSS funcionan vía file://.</p>
<p id="js-status" class="fail">JS no ha ejecutado todavía…</p>
<button onclick="document.getElementById('log').textContent += '\nClick funcionó: ' + new Date().toLocaleTimeString();">Pulsar para probar JS</button>
<div id="log"></div>
<script>
document.getElementById('js-status').textContent = '✓ JS ejecutándose correctamente';
document.getElementById('js-status').className = 'ok';
document.getElementById('log').textContent = '✓ script inline ejecutado en load';
let count = 0;
setInterval(() => {
  count++;
  document.title = 'Test ' + count + 's';
}, 1000);
</script>
</body></html>
